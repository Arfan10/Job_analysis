services:
  python-app:
    build: .
    container_name: python-container
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres-db
    volumes:
      - .:/app
    networks:
      - app-network

  postgres-db:
    image: postgres:17
    container_name: postgres-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"   # Connect via port 5433 in pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: dbt-container
    working_dir: /usr/app/analytics
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    volumes:
      - .:/usr/app
      - ./profiles:/root/.dbt
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    tty: true
    ports:
      - "8085:8085"

  # --- Airflow Services ---
  airflow-init:
    image: apache/airflow:2.8.0
    container_name: airflow-init
    environment:
      # Pass natively using variables, isolated on internal port 5432
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network
    command: version

  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: airflow-webserver
    restart: always
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/app
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg[binary] requests
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - app-network
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/app
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg[binary] requests

    volumes:
      - .:/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - app-network
    command: scheduler

# CRITICAL FIX: Explicitly declaring the network layout at root level
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: